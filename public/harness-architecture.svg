<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Quantaris Harness on Google Cloud</title><desc id="desc">Architecture diagram: users access a Next.js frontend on Cloud Run, which calls the Google ADK orchestration API. The orchestration API uses Vertex AI through LiteLLM and saves state to Cloud SQL Postgres, Memorystore Redis, Cloud Storage and observability services.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F7FF"/><stop offset="1" stop-color="#EEF5FF"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2b2252" flood-opacity=".13"/></filter><style>text{font-family:Arial,sans-serif;fill:#211D35}.t{font-size:27px;font-weight:700}.s{font-size:17px;fill:#66627A}.k{font-size:14px;font-weight:700;letter-spacing:1.7px;fill:#7464B8}.box{fill:#fff;stroke:#E3E0EC;stroke-width:2}.gcp{fill:#F0EDFF;stroke:#C8BBFF;stroke-width:2}.data{fill:#EBF8F4;stroke:#BDE6D9;stroke-width:2}.line{stroke:#9A8ED0;stroke-width:3;fill:none}.dash{stroke:#B6ADCC;stroke-width:2;stroke-dasharray:8 7;fill:none}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="76" class="k">QUANTARIS AI · REFERENCE ARCHITECTURE</text><text x="80" y="122" class="t" font-size="40">Multi-agent harness — Google Cloud first</text><text x="80" y="155" class="s">A secure execution loop for turning one business goal into a reviewed, traceable outcome.</text><g filter="url(#shadow)"><rect x="80" y="260" width="230" height="160" rx="20" class="box"/><text x="110" y="310" class="k">EXPERIENCE</text><text x="110" y="348" class="t">Operators</text><text x="110" y="378" class="s">CEO · reviewers · teams</text><rect x="370" y="235" width="315" height="210" rx="20" class="gcp"/><text x="402" y="283" class="k">CLOUD RUN · WEB</text><text x="402" y="325" class="t">Next.js control plane</text><text x="402" y="357" class="s">Mission console · auth · APIs</text><text x="402" y="389" class="s">Server components &amp; actions</text><rect x="760" y="205" width="380" height="270" rx="20" class="gcp"/><text x="792" y="253" class="k">CLOUD RUN · ORCHESTRATION</text><text x="792" y="297" class="t">Google ADK runtime</text><text x="792" y="330" class="s">Planner · specialist agents · judge</text><text x="792" y="360" class="s">Policy gates · tool routing · audit trail</text><rect x="1215" y="235" width="305" height="210" rx="20" class="gcp"/><text x="1247" y="283" class="k">VERTEX AI</text><text x="1247" y="325" class="t">Model gateway</text><text x="1247" y="357" class="s">Gemini + approved models</text><text x="1247" y="389" class="s">LiteLLM provider adapter</text><path d="M310 340H370M685 340H760M1140 340H1215" class="line"/><path d="M355 330l15 10-15 10M745 330l15 10-15 10M1200 330l15 10-15 10" fill="#9A8ED0"/><text x="80" y="545" class="k">CONTROLLED STATE &amp; EVIDENCE</text><g filter="url(#shadow)"><rect x="210" y="595" width="250" height="145" rx="18" class="data"/><text x="240" y="639" class="k">CLOUD SQL</text><text x="240" y="677" class="t">PostgreSQL</text><text x="240" y="706" class="s">Missions · users · audit</text><rect x="530" y="595" width="250" height="145" rx="18" class="data"/><text x="560" y="639" class="k">MEMORYSTORE</text><text x="560" y="677" class="t">Redis</text><text x="560" y="706" class="s">Sessions · queues · cache</text><rect x="850" y="595" width="250" height="145" rx="18" class="data"/><text x="880" y="639" class="k">CLOUD STORAGE</text><text x="880" y="677" class="t">Artifacts</text><text x="880" y="706" class="s">Files · outputs · evidence</text><rect x="1170" y="595" width="250" height="145" rx="18" class="data"/><text x="1200" y="639" class="k">CLOUD OPERATIONS</text><text x="1200" y="677" class="t">Observability</text><text x="1200" y="706" class="s">Logs · traces · evaluation</text></g><path d="M950 475V540H335V595M950 540H655V595M950 540H975V595M950 540H1295V595" class="dash"/><text x="80" y="816" class="s">Security foundation: Cloud Identity / IAP · Secret Manager · IAM service accounts · VPC egress controls · Cloud Audit Logs</text><text x="80" y="855" class="s">Asynchronous work: Cloud Tasks / Pub/Sub dispatch long-running agent jobs to dedicated Cloud Run workers.</text></svg>
